services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: minimal_api_app
    ports:
      - "5231:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__MySql=Server=mysql;Database=minimal_api;Uid=root;Pwd=root_strong_password_2026;
      - Jwt__Key=MINIMAL_API_SUPER_SECRET_KEY_FOR_SIGNING_TOKENS_2026_CHANGE_IN_PRODUCTION!
      - Jwt__Issuer=MinimalAPI
      - Jwt__Audience=MinimalAPIClient
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - minimal_net

  mysql:
    image: mysql:8.0
    container_name: minimal_api_db
    environment:
      - MYSQL_ROOT_PASSWORD=root_strong_password_2026
      - MYSQL_DATABASE=minimal_api
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_strong_password_2026"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    networks:
      - minimal_net

volumes:
  mysql_data:

networks:
  minimal_net:
    driver: bridge
