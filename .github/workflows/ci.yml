name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-test:
    name: .NET 10 Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore minimal-api.sln

    - name: Build Solution
      run: dotnet build minimal-api.sln --no-restore --configuration Release

    - name: Run Tests with Coverage
      run: dotnet test minimal-api.sln --no-build --configuration Release --collect:"XPlat Code Coverage"

  frontend-build:
    name: React 19 Frontend Lint & Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: FRONT/package-lock.json

    - name: Install Frontend Dependencies
      working-directory: ./FRONT
      run: npm ci

    - name: TypeScript Verification & Vite Build
      working-directory: ./FRONT
      run: npm run build
